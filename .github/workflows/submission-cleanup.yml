name: One-shot dissertation submission cleanup

on:
  push:
    branches:
      - dissertation-submission-cleanup
    paths:
      - '.github/workflows/submission-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: dissertation-submission-cleanup
          fetch-depth: 0

      - name: Run deterministic cleanup
        run: python .github/submission_cleanup.py

      - name: Remove one-shot helper files
        run: |
          rm -f .github/submission_cleanup.py
          rm -f .github/workflows/submission-cleanup.yml

      - name: Commit cleaned submission tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Finalise dissertation submission reproducibility cleanup'
          git push origin HEAD:dissertation-submission-cleanup
