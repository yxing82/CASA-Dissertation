name: One-shot case-locator label fix

on:
  push:
    branches:
      - dissertation-submission-cleanup
    paths:
      - '.github/workflows/fix-case-locator-label.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dissertation-submission-cleanup
      - name: Correct stale output label and self-remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('notebooks/05_mechanisms_cases/03_case_locator.ipynb')
          s = p.read_text(encoding='utf-8')
          old = 'outputs/case_study/locator_map/fig_eda10_v7_mechanism_case_locator_20260729.png'
          new = 'outputs/case_study/locator_map/fig_eda10_v8_mechanism_case_locator_20260801.png'
          if old not in s:
              raise SystemExit('Expected stale v7 output label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-case-locator-label.yml
      - name: Commit final documentation consistency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align case locator documentation with final output path'
          git push origin HEAD:dissertation-submission-cleanup
